name: Check and publish

# On every push and pull request: check the types and the lint, then build the app.
# On pushes to main the build is also published to GitHub Pages, so the app can be opened in a browser.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # the army builder's rules (community BSData files): downloaded fresh for every build and published with the site
      - name: Rules data for the army builder
        run: npm run data

      - name: Types and build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # After a push to main passes the checks, asks the event server (norberta) to pull and rebuild. The hook answers straight away
  # and the build runs there; its log is warhammer-deploy/deploy.log next to the checkout. Needs the DEPLOY_TOKEN secret.
  deploy-server:
    name: Deploy to the event server
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Call the deploy hook
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then echo "No DEPLOY_TOKEN secret: not deploying."; exit 0; fi
          curl -fsS --retry 3 --retry-all-errors --max-time 20 -X POST -H "Authorization: Bearer $DEPLOY_TOKEN" https://deploy.warhammer.dropzone.im/

  deploy:
    name: Publish to GitHub Pages
    needs: check
    # Only publishes when the repository variable DEPLOY_PAGES is set to true (GitHub Pages needs a public repo on the free plan).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
